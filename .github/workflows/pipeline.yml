name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check src api tests main.py app.py

      - name: Generate synthetic data for offline tests
        run: PYTHONPATH=. python scripts/generate_sample_data.py

      - name: Run tests with coverage
        run: PYTHONPATH=. pytest

      - name: Smoke-test full pipeline on synthetic data
        run: |
          PYTHONPATH=. python -m src.clean
          PYTHONPATH=. python -m src.model

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build Streamlit image
        run: docker build --target streamlit -t pl-analytics-streamlit .
      - name: Build API image
        run: docker build --target api -t pl-analytics-api .
